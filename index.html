<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="content">
      <header>
        <h2>Ремонт техники различных брендов</h2>
      </header>

      <div class="swiper mobile-swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <img src="img/lenovo.png" alt="lenovo-logo" />
            <a href="#"><img src="img/logo/go.svg" alt="lenovo" /></a>
          </div>

          <div class="swiper-slide">
            <img src="img/samsung.png" alt="samsung" />
            <a href="#"><img src="img/logo/go.svg" alt="samsung" /></a>
          </div>
          <div class="swiper-slide">
            <img src="img/apple.png" alt="apple" />
            <a href="#"><img src="img/logo/go.svg" alt="apple" /></a>
          </div>

          <div class="swiper-slide">
            <img src="img/bosch.png" alt="bosch" />
            <a href="#"><img src="img/logo/go.svg" alt="bosch" /></a>
          </div>
          <div class="swiper-slide">
            <img src="img/hp.png" alt="hp" />
            <a href="#"><img src="img/logo/go.svg" alt="hp" /></a>
          </div>
          <div class="swiper-slide">
            <img src="img/acer.png" alt="acer" />
            <a href="#"><img src="img/logo/go.svg" alt="acer" /></a>
          </div>
          <div class="swiper-slide">
            <img src="img/sonic.png" alt="view-sonic" />
            <a href="#"><img src="img/logo/go.svg" alt="sonic" /></a>
          </div>
          <div class="swiper-slide">
            <img src="img/sony.png" alt="sony" />
            <a href="#"><img src="img/logo/go.svg" alt="sony" /></a>
          </div>
          <div class="swiper-slide">
            <img src="img/lenovo.png" alt="lenovo-logo" />
            <a href="#"><img src="img/logo/go.svg" alt="lenovo" /></a>
          </div>
          <div class="swiper-slide">
            <img src="img/samsung.png" alt="samsung" />
            <a href="#"><img src="img/logo/go.svg" alt="samsung" /></a>
          </div>
          <div class="swiper-slide">
            <img src="img/apple.png" alt="apple" />
            <a href="#"><img src="img/logo/go.svg" alt="apple" /></a>
          </div>
        </div>
        <!--swiper-wrapper -->
        <div class="swiper-pagination"></div>
      </div>
      <!---swiper mobile-swiper--->

      <!---tablet-desktop--->

      <div class="grid desktop-grid">
        <div class="content-card">
          <img src="img/lenovo.png" alt="lenovo-logo" />
          <a href="#"><img src="img/logo/go.svg" alt="lenovo" /></a>
        </div>

        <div class="content-card">
          <img src="img/samsung.png" alt="samsung" />
          <a href="#"><img src="img/logo/go.svg" alt="samsung" /></a>
        </div>

        <div class="content-card">
          <img src="img/apple.png" alt="apple" />
          <a href="#"><img src="img/logo/go.svg" alt="apple" /></a>
        </div>

        <div class="content-card">
          <img src="img/bosch.png" alt="bosch" />
          <a href="#"><img src="img/logo/go.svg" alt="bosch" /></a>
        </div>

        <div class="content-card">
          <img src="img/hp.png" alt="hp" />
          <a href="#"><img src="img/logo/go.svg" alt="hp" /></a>
        </div>

        <div class="content-card">
          <img src="img/acer.png" alt="acer" />
          <a href="#"><img src="img/logo/go.svg" alt="acer" /></a>
        </div>

        <div class="content-card hide-tablet">
          <img src="img/sonic.png" alt="view-sonic" />
          <a href="#"><img src="img/logo/go.svg" alt="sonic" /></a>
        </div>

        <div class="content-card hide-tablet">
          <img src="img/sony.png" alt="sony" />
          <a href="#"><img src="img/logo/go.svg" alt="sony" /></a>
        </div>

        <div class="content-card hide-tablet hide-desktop">
          <img src="img/lenovo.png" alt="lenovo-logo" />
          <a href="#"><img src="img/logo/go.svg" alt="lenovo" /></a>
        </div>

        <div class="content-card hide-tablet hide-desktop">
          <img src="img/samsung.png" alt="samsung" />
          <a href="#"><img src="img/logo/go.svg" alt="samsung" /></a>
        </div>

        <div class="content-card hide-tablet hide-desktop">
          <img src="img/apple.png" alt="apple" />
          <a href="#"><img src="img/logo/go.svg" alt="apple" /></a>
        </div>
      </div>
      <!--grid desktop-grid-->

      <div class="see-more-btn">
        <img src="img/logo/seemore.svg" alt="see more logo" />
        <button id="toggleBtn"><span>Показать все</span></button>
      </div>
    </div>
    <!---content-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js" defer></script>
  </body>
</html>
